<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>Sound Mixer Party - Confetti Ver.</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 10px;
            color: #333;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #ff4757;
        }

        .btn-vol {
            background: #6c757d;
            padding: 8px;
            font-size: 11px;
            margin: 2px;
            flex: 1;
            border-radius: 5px;
            color: white;
            border: none;
        }

        .btn-vol.active {
            background: #007bff;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .host-area {
            border: 3px solid #ff4757;
            background: #fff5f5;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .point-chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            min-height: 50px;
        }

        .chip {
            width: 45px;
            height: 45px;
            line-height: 45px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 0 #0056b3;
        }

        .chip.used {
            opacity: 0.2;
            transform: scale(0.8);
        }

        .chip[data-pt="-2"] {
            background: #ff4757;
            box-shadow: 0 3px 0 #c0392b;
        }

        .chip[data-pt="3"] {
            background: #ffca28;
            color: #333;
            box-shadow: 0 3px 0 #f57f17;
        }

        .sound-control {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .pt-slot {
            height: 50px;
            border: 2px dashed #aaa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
            background: #fff;
            font-weight: bold;
            color: #999;
        }

        .pt-slot.filled {
            border: 2px solid #007bff;
            color: #333;
            background: #e3f2fd;
        }

        .hidden {
            display: none !important;
        }

        /* --- 演出用 --- */
        #danger-overlay,
        #success-overlay,
        #great-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay-text {
            font-size: 14vw;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            width: 90%;
        }

        .overlay-pt {
            font-size: 10vw;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 30px;
            border-radius: 50px;
            margin-top: 15px;
            font-weight: bold;
        }

        /* シェイク（ペナルティ用） */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-12px);
            }

            75% {
                transform: translateX(12px);
            }
        }

        .shake-it {
            animation: shake 0.1s infinite;
        }

        /* 紙吹雪用キャンバス */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        /* 結果発表 */
        #result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #f0f2f5;
            z-index: 8000;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            display: none;
        }

        .final-rank {
            font-size: 1.2em;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            align-items: center;
        }

        .rank-1 {
            background: linear-gradient(135deg, #fff9c4, #fffde7);
            border: 2px solid #fbc02d;
            font-weight: bold;
            font-size: 1.5em;
        }
    </style>
</head>

<body id="main-body">

    <canvas id="confetti-canvas"></canvas>

    <div id="danger-overlay" style="background:rgba(255,0,0,0.8)">
        <div class="overlay-text">DANGER!</div>
        <div class="overlay-pt">-2 pt</div>
    </div>
    <div id="success-overlay" style="background:rgba(40,167,69,0.9)">
        <div id="success-name" class="overlay-text">GOOD!</div>
        <div id="success-pt" class="overlay-pt">+ pt</div>
    </div>
    <div id="great-overlay" style="background:rgba(218,165,32,0.6)">
        <div id="great-name" class="overlay-text">GREAT!!</div>
        <div id="great-pt" class="overlay-pt">+3 pt</div>
    </div>

    <div id="result-screen">
        <h1 style="color: #007bff;">🏆 最終ランキング 🏆</h1>
        <div id="final-list"></div>
        <br>
        <button class="btn btn-danger" style="width: 100%; padding: 20px;" onclick="resetAll()">タイトルへ戻る</button>
    </div>

    <div id="setup-screen" class="card">
        <h1>🔊 Sound Mixer Party</h1>
        <input type="text" id="player-name" placeholder="名前を入力" style="padding:15px; width:80%; font-size:18px;">
        <br><br>
        <button class="btn" style="width: 80%; padding: 15px;" onclick="joinGame()">ゲームに参加する</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:12px;">
                <span id="current-role">...</span>
                <a href="#" onclick="leaveGame()" style="color:#999;">退出</a>
            </div>
            <h2 id="my-score">0 pt</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <button id="gen-btn" class="btn" onclick="generateSounds()">1. 音源をランダム選出</button>
            <div id="playback-area" class="hidden">
                <div class="point-chips">
                    <div class="chip" id="btn-pt-1" onclick="selectChip(1, this)">1pt</div>
                    <div class="chip" id="btn-pt-2" onclick="selectChip(2, this)">2pt</div>
                    <div class="chip" id="btn-pt-3" onclick="selectChip(3, this)">3pt</div>
                    <div class="chip" id="btn-pt-m2" onclick="selectChip(-2, this)">-2pt</div>
                </div>
                <div style="margin:10px 0;">
                    <button class="btn btn-success" onclick="playAll()">▶ 再生</button>
                    <button class="btn btn-danger" onclick="pauseAll()">⏸ 停止</button>
                </div>
                <div id="sound-mixers"></div>
            </div>
            <hr>
            <div id="player-scoring"></div>
            <button class="btn btn-success" style="width:100%; margin-top:15px;" onclick="endTurn()">交代</button>
            <button class="btn btn-danger" style="width:100%; margin-top:10px; background:#666;"
                onclick="window.finishGame()">🏁 試合終了</button>
        </div>

        <div id="player-waiting" class="card hidden">ホストが準備中...👂</div>
        <div class="card">
            <div id="rankings"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { soundList } from "./sounds.js";

        // FIXME: FirebaseConfigを上書き
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioElements = [];
        let distributedPlayers = new Set();
        let soundPoints = [null, null, null, null];
        let lastAwardId = "INITIAL_IGNORE";
        let currentSelectedPt = null;

        // --- 紙吹雪ロジック ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function createConfetti() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 7 + 3,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    velX: Math.random() * 2 - 1,
                    velY: Math.random() * 3 + 2,
                    angle: Math.random() * 360
                });
            }
            requestAnimationFrame(updateConfetti);
        }
        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.y += p.velY;
                p.x += p.velX;
                p.angle += 5;
                ctx.fillStyle = p.color;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle * Math.PI / 180);
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
                if (p.y > canvas.height) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        window.joinGame = async () => {
            const silent = new Audio(); silent.play().catch(() => { });
            const nameInput = document.getElementById('player-name').value;
            if (!nameInput) return;
            myName = nameInput;
            const snap = await getDoc(gameRef);
            if (!snap.exists()) {
                await setDoc(gameRef, { players: [{ name: myName, score: 0 }], hostIndex: 0, updatedAt: serverTimestamp(), isFinished: false });
            } else {
                const players = snap.data().players;
                if (!players.find(p => p.name === myName)) {
                    players.push({ name: myName, score: 0 });
                    await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
                }
            }
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) { location.reload(); return; }
                const data = docSnap.data();
                if (data.isFinished) {
                    showFinalResults(data.players);
                } else {
                    checkAwardEffect(data);
                    updateUI(data);
                }
            });
        }

        function showFinalResults(players) {
            const sorted = [...players].sort((a, b) => b.score - a.score);
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('final-list').innerHTML = sorted.map((p, i) => `
                <div class="final-rank ${i === 0 ? 'rank-1' : ''}">
                    <span>${i + 1}位: ${p.name}</span>
                    <b>${p.score} pt</b>
                </div>
            `).join('');
            window.scrollTo(0, 0);
        }

        function checkAwardEffect(data) {
            const award = data.lastAward;
            if (!award || award.target !== myName || award.id === lastAwardId) {
                if (lastAwardId === "INITIAL_IGNORE" && award) lastAwardId = award.id;
                return;
            }
            lastAwardId = award.id;
            const isDanger = award.pt < 0;
            const isGreat = award.pt === 3;
            const id = isDanger ? 'danger-overlay' : (isGreat ? 'great-overlay' : 'success-overlay');
            const sound = isDanger ? 'warn.mp3' : (isGreat ? 'great.mp3' : 'success.mp3');

            if (!isDanger) {
                const type = isGreat ? 'great' : 'success';
                document.getElementById(`${type}-name`).innerText = award.soundName.toUpperCase();
                document.getElementById(`${type}-pt`).innerText = `+${award.pt} pt`;
            }

            const overlay = document.getElementById(id);
            overlay.style.display = 'flex';

            // 演出分岐
            if (isDanger) {
                document.getElementById('main-body').classList.add('shake-it');
            } else if (isGreat) {
                createConfetti(); // 紙吹雪
            }

            new Audio(`sounds/${sound}`).play().catch(e => console.log(e));

            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('main-body').classList.remove('shake-it');
            }, 3500);
        }

        window.selectChip = (pt, el) => {
            if (el.classList.contains('used')) return;
            document.querySelectorAll('.chip').forEach(c => c.style.border = "none");
            currentSelectedPt = pt;
            el.style.border = "3px solid #333";
        };

        window.setPointToSlot = (idx) => {
            if (currentSelectedPt === null) return;
            const oldIdx = soundPoints.indexOf(currentSelectedPt);
            if (oldIdx !== -1) {
                soundPoints[oldIdx] = null;
                document.getElementById(`slot-${oldIdx}`).innerText = "？ pt";
                document.getElementById(`slot-${oldIdx}`).classList.remove('filled');
            }
            soundPoints[idx] = currentSelectedPt;
            const slot = document.getElementById(`slot-${idx}`);
            slot.innerText = currentSelectedPt + " pt";
            slot.classList.add('filled');
            updateChipStatus();
        };

        function updateChipStatus() {
            document.querySelectorAll('.chip').forEach(chip => {
                const ptText = chip.innerText.replace('pt', '');
                const pt = ptText === '-2' ? -2 : parseInt(ptText);
                chip.classList.toggle('used', soundPoints.includes(pt));
                if (soundPoints.includes(pt)) chip.style.border = "none";
            });
            currentSelectedPt = null;
        }

        function updateUI(data) {
            const players = data.players || [];
            const host = players[data.hostIndex % players.length];
            const isHost = (host && host.name === myName);
            document.getElementById('current-role').innerText = isHost ? "役割: ホスト 👑" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);
            document.getElementById('player-waiting').classList.toggle('hidden', isHost);
            if (!isHost) stopAllSounds();
            document.getElementById('my-score').innerText = (players.find(p => p.name === myName)?.score || 0) + " pt";
            document.getElementById('rankings').innerHTML = [...players].sort((a, b) => b.score - a.score).map(p => `
                <div class="player-item"><span>${p.name}</span><b>${p.score} pt</b></div>
            `).join('');
            if (isHost) {
                document.getElementById('player-scoring').innerHTML = players.map(p => {
                    const isDone = distributedPlayers.has(p.name);
                    return `<div style="margin:8px 0; border-bottom:1px solid #eee; padding-bottom:8px;">
                        <span>${p.name}</span><br>
                        ${isDone ? '✅' : `
                            <button class="btn btn-vol" onclick="window.distributePt('${p.name}', 0)">音1</button>
                            <button class="btn btn-vol" onclick="window.distributePt('${p.name}', 1)">音2</button>
                            <button class="btn btn-vol" onclick="window.distributePt('${p.name}', 2)">音3</button>
                            <button class="btn btn-vol btn-danger" onclick="window.distributePt('${p.name}', 3)">音4</button>
                            <button class="btn btn-vol btn-success" onclick="window.distributeManual('${p.name}', 2)">+2</button>
                        `}</div>`;
                }).join('');
            }
        }

        window.distributePt = async (target, sIdx) => {
            const pt = soundPoints[sIdx];
            if (pt === null) return alert("pt未設定");
            await window.distributeManual(target, pt, window.currentSoundNames[sIdx]);
        };

        window.distributeManual = async (target, pt, sName = "SPECIAL") => {
            if (distributedPlayers.has(target)) return;
            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => { if (p.name === target) p.score += pt; return p; });
            await updateDoc(gameRef, { players, updatedAt: serverTimestamp(), lastAward: { target, pt, soundName: sName, id: Math.random() } });
            distributedPlayers.add(target);
        };

        window.changeVolSimple = (idx, level, btn) => {
            const volumes = [0, 0.4, 1.0];
            if (audioElements[idx]) audioElements[idx].volume = volumes[level];
            Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.generateSounds = () => {
            const shuffled = [...soundList].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 4);
            window.currentSoundNames = selected.map(s => s.name);
            document.getElementById('sound-mixers').innerHTML = selected.map((sound, i) => {
                const audio = new Audio(sound.file); audio.loop = true; audio.volume = 0; audioElements.push(audio);
                return `
                <div class="sound-control">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px;">音${i + 1}: <b>${sound.name}</b></span>
                        <div class="vol-group">
                            <button class="btn btn-vol active" onclick="window.changeVolSimple(${i}, 0, this)">OFF</button>
                            <button class="btn btn-vol" onclick="window.changeVolSimple(${i}, 1, this)">中</button>
                            <button class="btn btn-vol" onclick="window.changeVolSimple(${i}, 2, this)">大</button>
                        </div>
                    </div>
                    <div class="pt-slot" id="slot-${i}" onclick="window.setPointToSlot(${i})">？ pt</div>
                </div>`;
            }).join('');
            document.getElementById('playback-area').classList.remove('hidden');
        };

        window.stopAllSounds = () => {
            audioElements.forEach(a => { a.pause(); a.currentTime = 0; });
            audioElements = [];
            document.getElementById('sound-mixers').innerHTML = "";
            document.getElementById('playback-area').classList.add('hidden');
            soundPoints = [null, null, null, null];
            document.querySelectorAll('.chip').forEach(c => { c.classList.remove('used'); c.style.border = "none"; });
        };

        window.playAll = () => audioElements.forEach(a => a.play().catch(() => { }));
        window.pauseAll = () => audioElements.forEach(a => a.pause());
        window.finishGame = async () => { if (confirm("終了しますか？")) await updateDoc(gameRef, { isFinished: true, updatedAt: serverTimestamp() }); };
        window.endTurn = async () => {
            if (!confirm("交代しますか？")) return;
            window.stopAllSounds(); distributedPlayers.clear();
            const snap = await getDoc(gameRef);
            await updateDoc(gameRef, { hostIndex: (snap.data().hostIndex + 1) % snap.data().players.length, updatedAt: serverTimestamp(), lastAward: null });
        };
        window.resetAll = async () => { if (confirm("リセット？")) { await deleteDoc(gameRef); location.reload(); } };
        window.leaveGame = async () => { location.reload(); };
    </script>
</body>

</html>
