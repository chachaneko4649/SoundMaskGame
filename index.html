<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Mixer Party (Auto-Reset Ver.)</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ff4757; }
        .btn-secondary { background: #6c757d; margin-top: 10px; }
        .host-area { border: 3px solid #ff4757; background: #fff5f5; }
        .player-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        .sound-control { margin: 15px 0; padding: 10px; background: #eee; border-radius: 10px; }
        input[type=range] { width: 80%; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="setup-screen" class="card">
        <h2>サウンドパーティー</h2>
        <input type="text" id="player-name" placeholder="名前を入力" style="padding:10px; width:70%;">
        <br><br>
        <button class="btn" onclick="joinGame()">ゲームに参加</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-role" style="margin:0;">役割確認中...</h3>
                <button class="btn btn-secondary" onclick="leaveGame()">退出する</button>
            </div>
            <h2 id="my-score">ポイント: 0</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 ホスト操作</h3>
            <button class="btn" onclick="generateSounds()">音を生成</button>
            <div id="sound-mixers"></div>
            <hr>
            <h4>ポイント配布</h4>
            <div id="player-scoring"></div>
            <button class="btn" style="background:#28a745; width:100%; padding:15px; margin-top:10px;" onclick="endTurn()">ターン終了</button>
        </div>

        <div id="player-waiting" class="card hidden">
            <p>ホストが音を作成中...</p>
        </div>

        <div class="card">
            <h3>プレイヤー一覧</h3>
            <div id="rankings"></div>
            <hr>
            <button class="btn btn-danger" onclick="resetAll()">強制リセット</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FIXME: 自身のFirebase Configを必ず貼り付けてください
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioContext = null;
        let oscillators = [];
        let gainNodes = [];

        window.joinGame = async () => {
            const nameInput = document.getElementById('player-name').value;
            if(!nameInput) return alert("名前を入力してください");
            myName = nameInput;

            const snap = await getDoc(gameRef);
            let shouldInit = !snap.exists();

            if (snap.exists()) {
                const data = snap.data();
                // 10分(600,000ミリ秒)以上経過しているかチェック
                const lastUpdate = data.updatedAt ? data.updatedAt.toMillis() : 0;
                const now = Date.now();
                if (now - lastUpdate > 600000) {
                    shouldInit = true; // 古いデータなのでリセット
                }
            }

            if (shouldInit) {
                await setDoc(gameRef, { 
                    players: [{name: myName, score: 0}], 
                    hostIndex: 0,
                    updatedAt: serverTimestamp() 
                });
            } else {
                const data = snap.data();
                const players = data.players || [];
                if(players.find(p => p.name === myName)) return alert("その名前は使用中");
                players.push({name: myName, score: 0});
                await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
            }
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) { location.reload(); return; }
                updateUI(docSnap.data());
            });
        }

        function updateUI(data) {
            const players = data.players || [];
            if(players.length === 0) return;
            const host = players[data.hostIndex % players.length];
            const isHost = (host && host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "役割: ホスト" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);
            document.getElementById('player-waiting').classList.toggle('hidden', isHost);

            if (!isHost) stopAllSounds();

            document.getElementById('my-score').innerText = `ポイント: ${players.find(p=>p.name===myName)?.score || 0}`;
            document.getElementById('rankings').innerHTML = players.map(p => `
                <div class="player-item"><span>${p.name} ${p.name===host.name?'👑':''}</span><b>${p.score}pt</b></div>
            `).join('');

            if(isHost) {
                document.getElementById('player-scoring').innerHTML = players.map(p => `
                    <div style="margin:5px 0;">${p.name}: 
                        <button onclick="window.addPt('${p.name}', 1)">+1</button>
                        <button onclick="window.addPt('${p.name}', 2)">+2</button>
                        <button onclick="window.addPt('${p.name}', 3)">+3</button>
                        <button onclick="window.addPt('${p.name}', -2)">-2</button>
                    </div>
                `).join('');
            }
        }

        window.addPt = async (targetName, pt) => {
            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => {
                if(p.name === targetName) p.score += pt;
                return p;
            });
            await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
        };

        window.leaveGame = async () => {
            const snap = await getDoc(gameRef);
            const players = snap.data().players.filter(p => p.name !== myName);
            if(players.length === 0) {
                await deleteDoc(gameRef);
            } else {
                await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
            }
            location.reload();
        };

        window.resetAll = async () => { if(confirm("全員消去しますか？")) await deleteDoc(gameRef); };

        // ページを閉じた時に自動退出を試みる
        window.addEventListener('beforeunload', () => {
            if(myName) window.leaveGame();
        });

        /* --- 音響・ターン管理 (前回のロジックを維持) --- */
        window.stopAllSounds = () => { oscillators.forEach(o => {try{o.stop()}catch(e){}}); oscillators = []; gainNodes = []; };
        window.changeVol = (i, v) => { if(gainNodes[i]) gainNodes[i].gain.value = v; };
        window.generateSounds = () => {
            if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            window.stopAllSounds();
            const types = ['sine', 'square', 'sawtooth', 'triangle'];
            types.forEach((type, i) => {
                const g = audioContext.createGain(); const o = audioContext.createOscillator();
                o.type = type; o.frequency.value = 200 + (i*100);
                o.connect(g).connect(audioContext.destination); g.gain.value = 0; o.start();
                oscillators.push(o); gainNodes.push(g);
                document.getElementById('sound-mixers').innerHTML += `<div class="sound-control">音${i+1}<br><input type="range" min="0" max="0.3" step="0.05" value="0" oninput="window.changeVol(${i}, this.value)"></div>`;
            });
        };
        window.endTurn = async () => {
            const snap = await getDoc(gameRef);
            const data = snap.data();
            await updateDoc(gameRef, { hostIndex: (data.hostIndex + 1) % data.players.length, updatedAt: serverTimestamp() });
            window.stopAllSounds();
        };
    </script>
</body>
</html>
