<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Mixer Party (Ver.2)</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ff4757; }
        .btn-secondary { background: #6c757d; margin-top: 10px; }
        .host-area { border: 3px solid #ff4757; background: #fff5f5; }
        .player-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        .sound-control { margin: 15px 0; padding: 10px; background: #eee; border-radius: 10px; }
        input[type=range] { width: 80%; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="setup-screen" class="card">
        <h2>サウンドパーティー</h2>
        <input type="text" id="player-name" placeholder="名前を入力" style="padding:10px; width:70%;">
        <br><br>
        <button class="btn" onclick="joinGame()">ゲームに参加</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-role" style="margin:0;">役割確認中...</h3>
                <button class="btn btn-secondary" onclick="leaveGame()">退出する</button>
            </div>
            <h2 id="my-score">ポイント: 0</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 あなたはホストです</h3>
            <button class="btn" onclick="generateSounds()">音をランダム生成</button>
            <div id="sound-mixers"></div>
            <hr>
            <h4>ポイント配布 (回答した人に)</h4>
            <div id="player-scoring"></div>
            <br>
            <button class="btn" style="background:#28a745; width:100%; padding:15px;" onclick="endTurn()">ターン終了 (次へ交代)</button>
        </div>

        <div class="card">
            <h3>プレイヤー一覧</h3>
            <div id="rankings"></div>
            <hr>
            <button class="btn btn-danger" style="font-size: 0.8em;" onclick="resetAll()">※ 全員のデータをリセット(解散)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FIXME: ここにあなたのFirebase設定を貼り付けてください
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioContext = null;
        let oscillators = [];
        let gainNodes = [];

        // 参加処理
        window.joinGame = async () => {
            const nameInput = document.getElementById('player-name').value;
            if(!nameInput) return alert("名前を入力してください");
            myName = nameInput;

            const snap = await getDoc(gameRef);
            if (!snap.exists()) {
                await setDoc(gameRef, { players: [{name: myName, score: 0}], hostIndex: 0 });
            } else {
                const data = snap.data();
                const players = data.players || [];
                // 同じ名前がいないかチェック
                if(players.find(p => p.name === myName)) {
                    alert("その名前はすでに使われています");
                    return;
                }
                players.push({name: myName, score: 0});
                await updateDoc(gameRef, { players });
            }
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        // リアルタイム同期
        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) {
                    // データが消された（リセットされた）らトップに戻る
                    location.reload();
                    return;
                }
                updateUI(docSnap.data());
            });
        }

        function updateUI(data) {
            const players = data.players || [];
            if(players.length === 0) return;

            // ホスト判定（プレイヤー人数が減った時のエラー防止）
            let hostIdx = data.hostIndex;
            if (hostIdx >= players.length) hostIdx = 0;
            
            const host = players[hostIdx];
            const isHost = (host && host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "役割: ホスト" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);

            const me = players.find(p => p.name === myName);
            if(me) document.getElementById('my-score').innerText = `ポイント: ${me.score}`;

            const rankDiv = document.getElementById('rankings');
            rankDiv.innerHTML = players.map(p => `
                <div class="player-item">
                    <span>${p.name}</span>
                    <b>${p.score}pt</b>
                </div>
            `).join('');

            if(isHost) {
                const scoringDiv = document.getElementById('player-scoring');
                scoringDiv.innerHTML = players.map(p => `
                    <div style="margin:10px 0; border:1px dashed #ccc; padding:5px;">
                        <b>${p.name}</b> へ: 
                        <button onclick="addPt('${p.name}', 1)">+1</button>
                        <button onclick="addPt('${p.name}', 2)">+2</button>
                        <button onclick="addPt('${p.name}', 3)">+3</button>
                        <button onclick="addPt('${p.name}', -2)">-2</button>
                    </div>
                `).join('');
            }
        }

        // 退出ボタン（自分だけ消える）
        window.leaveGame = async () => {
            if(!confirm("ゲームを抜けますか？")) return;
            const snap = await getDoc(gameRef);
            const players = snap.data().players.filter(p => p.name !== myName);
            await updateDoc(gameRef, { players });
            location.reload();
        };

        // 全員リセットボタン（データを完全に消去）
        window.resetAll = async () => {
            if(!confirm("全員を退場させて、ゲームを最初からリセットしますか？")) return;
            await deleteDoc(gameRef);
        };

        // 音の生成
        window.generateSounds = () => {
            if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const mixerDiv = document.getElementById('sound-mixers');
            mixerDiv.innerHTML = "";
            oscillators.forEach(o => o.stop());
            oscillators = [];
            gainNodes = [];

            const types = ['sine', 'square', 'sawtooth', 'triangle'];
            const pts = [1, 2, 3, -2];

            types.forEach((type, i) => {
                const gainNode = audioContext.createGain();
                const osc = audioContext.createOscillator();
                osc.type = type;
                osc.frequency.value = 200 + (i * 100);
                osc.connect(gainNode).connect(audioContext.destination);
                gainNode.gain.value = 0; 
                osc.start();
                
                oscillators.push(osc);
                gainNodes.push(gainNode);

                mixerDiv.innerHTML += `
                    <div class="sound-control">
                        音 ${i+1} (${pts[i]}pt設定) <br>
                        <input type="range" min="0" max="0.5" step="0.05" value="0" 
                        oninput="changeVol(${i}, this.value)">
                    </div>
                `;
            });
        };

        window.changeVol = (idx, vol) => {
            if(gainNodes[idx]) gainNodes[idx].gain.value = vol;
        };

        window.addPt = async (targetName, pt) => {
            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => {
                if(p.name === targetName) p.score += pt;
                return p;
            });
            await updateDoc(gameRef, { players });
        };

        window.endTurn = async () => {
            const snap = await getDoc(gameRef);
            const data = snap.data();
            let nextHost = data.hostIndex + 1;
            if(nextHost >= data.players.length) nextHost = 0;
            
            await updateDoc(gameRef, { hostIndex: nextHost });
            alert("ターン終了！次のホストに交代します。");
            // 音を強制停止するためにリロード
            location.reload();
        };
    </script>
</body>
</html>
