<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Mixer Party (Complete Ver.)</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #ff4757;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .host-area {
            border: 3px solid #ff4757;
            background: #fff5f5;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .sound-control {
            margin: 15px 0;
            padding: 15px;
            background: #eee;
            border-radius: 10px;
            text-align: left;
        }

        input[type=range] {
            width: 100%;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .score-badge {
            background: #ff4757;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        #playback-controls {
            margin: 20px 0;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            border: 2px solid #2196f3;
        }
    </style>
</head>

<body>

    <div id="setup-screen" class="card">
        <h2>サウンドパーティー</h2>
        <p>名前を入力して参加してください</p>
        <input type="text" id="player-name" placeholder="例: たろう" style="padding:10px; width:70%; font-size: 16px;">
        <br><br>
        <button class="btn" onclick="joinGame()">ゲームに参加</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-role" style="margin:0;">役割確認中...</h3>
                <button class="btn btn-secondary" onclick="leaveGame()">退出</button>
            </div>
            <h2 id="my-score">ポイント: 0</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 ホスト操作パネル</h3>
            <p style="font-size: 0.9em; color: #666;">①音を選び、②音量を調整してから、③再生してください</p>

            <button id="gen-btn" class="btn" onclick="generateSounds()">1. 音源をランダム選出</button>

            <div id="playback-area" class="hidden">
                <div id="playback-controls">
                    <p style="margin-bottom: 10px; font-weight: bold;">2. ミックス全体の操作</p>
                    <button class="btn btn-success" onclick="playAll()">▶ ミックス再生開始</button>
                    <button class="btn btn-danger" onclick="pauseAll()">⏸ 一時停止</button>
                </div>
                <div id="sound-mixers"></div>
            </div>

            <hr>
            <h4>ポイント配布 (口頭で回答を確認)</h4>
            <div id="player-scoring"></div>
            <button class="btn btn-success" style="width:100%; padding:15px; margin-top:20px; font-size: 1.1em;"
                onclick="endTurn()">ターンを終了して次のホストへ</button>
        </div>

        <div id="player-waiting" class="card hidden">
            <div style="font-size: 3em; margin-bottom: 10px;">👂</div>
            <p>ホストが音をミックスしています...<br>耳を澄ませて待ちましょう！</p>
        </div>

        <div class="card">
            <h3>プレイヤー一覧</h3>
            <div id="rankings"></div>
            <hr>
            <button class="btn btn-danger" style="font-size: 0.7em; opacity: 0.7;" onclick="resetAll()">※
                データをリセット(解散)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { soundList } from "./sounds.js";

        // FIXME: ここを自分の設定に上書きしてください
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioElements = [];
        let isSoundGenerated = false;

        // ゲーム参加
        window.joinGame = async () => {
            const nameInput = document.getElementById('player-name').value;
            if (!nameInput) return alert("名前を入力してください");
            myName = nameInput;

            const snap = await getDoc(gameRef);
            let shouldInit = !snap.exists();

            if (snap.exists()) {
                const data = snap.data();
                const lastUpdate = data.updatedAt ? data.updatedAt.toMillis() : 0;
                if (Date.now() - lastUpdate > 600000) shouldInit = true; // 10分放置でリセット
            }

            if (shouldInit) {
                await setDoc(gameRef, { players: [{ name: myName, score: 0 }], hostIndex: 0, updatedAt: serverTimestamp() });
            } else {
                const data = snap.data();
                const players = data.players || [];
                if (players.find(p => p.name === myName)) return alert("その名前は使用中");
                players.push({ name: myName, score: 0 });
                await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        // データのリアルタイム監視
        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) { location.reload(); return; }
                updateUI(docSnap.data());
            });
        }

        // 画面の更新
        function updateUI(data) {
            const players = data.players || [];
            if (players.length === 0) return;
            const host = players[data.hostIndex % players.length];
            const isHost = (host && host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "役割: あなたがホスト" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);
            document.getElementById('player-waiting').classList.toggle('hidden', isHost);

            // ホストでない場合は音を強制停止
            if (!isHost) stopAllSounds();

            document.getElementById('my-score').innerText = `ポイント: ${players.find(p => p.name === myName)?.score || 0}`;
            document.getElementById('rankings').innerHTML = players.map(p => `
                <div class="player-item"><span>${p.name} ${p.name === host.name ? '👑' : ''}</span><b>${p.score}pt</b></div>
            `).join('');

            if (isHost) {
                document.getElementById('player-scoring').innerHTML = players.map(p => `
                    <div style="margin:5px 0;">${p.name}: 
                        <button onclick="window.addPt('${p.name}', 1)">+1</button>
                        <button onclick="window.addPt('${p.name}', 2)">+2</button>
                        <button onclick="window.addPt('${p.name}', 3)">+3</button>
                        <button onclick="window.addPt('${p.name}', -2)">-2</button>
                    </div>
                `).join('');
            }
        }

        /* --- 音響管理ロジック --- */
        window.stopAllSounds = () => {
            audioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });
            audioElements = [];
            document.getElementById('sound-mixers').innerHTML = "";
            document.getElementById('playback-area').classList.add('hidden');

            // ボタンを復活させる
            const genBtn = document.getElementById('gen-btn');
            if (genBtn) {
                genBtn.disabled = false;
                genBtn.innerText = "1. 音源をランダム選出";
            }
            isSoundGenerated = false;
        };

        window.generateSounds = () => {
            if (isSoundGenerated) return; // 2度押し禁止

            const shuffled = [...soundList].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 4);
            const pts = [1,
