<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Mixer Party - Deluxe Ver.</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #ff4757;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-secondary {
            background: #6c757d;
            font-size: 14px;
        }

        .host-area {
            border: 3px solid #ff4757;
            background: #fff5f5;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .sound-control {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            border-left: 5px solid #007bff;
        }

        input[type=range] {
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .score-badge {
            background: #ff4757;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        #playback-controls {
            margin: 20px 0;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            border: 2px solid #2196f3;
        }

        .crown {
            color: #ffca28;
            font-size: 1.2em;
            margin-right: 5px;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.2);
        }

        /* --- 演出用アニメーション --- */
        @keyframes flash-red {

            0%,
            100% {
                background-color: rgba(255, 0, 0, 0.9);
            }

            50% {
                background-color: transparent;
            }
        }

        @keyframes bounce-in {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shine {
            0% {
                background-position: -200%;
            }

            100% {
                background-position: 200%;
            }
        }

        #danger-overlay,
        #success-overlay,
        #great-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: none;
            pointer-events: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #danger-overlay {
            animation: flash-red 0.25s infinite;
        }

        #success-overlay {
            background-color: rgba(40, 167, 69, 0.9);
            color: white;
        }

        /* 3ポイント用の豪華な背景 */
        #great-overlay {
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            background-size: 200% 200%;
            animation: shine 2s infinite linear;
            color: white;
        }

        .overlay-text {
            font-size: 15vw;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            line-height: 1.2;
            animation: bounce-in 0.5s;
        }

        .overlay-sub {
            font-size: 8vw;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div id="danger-overlay">
        <div class="overlay-text">DANGER!</div>
        <div class="overlay-sub">-2 POINTS!!</div>
    </div>
    <div id="success-overlay">
        <div id="success-name" class="overlay-text">GOOD!</div>
        <div id="success-pt" class="overlay-sub">+1 pt</div>
    </div>
    <div id="great-overlay">
        <div id="great-name" class="overlay-text">GREAT!!</div>
        <div id="great-pt" class="overlay-sub">+3 POINTS!!</div>
    </div>

    <div id="setup-screen" class="card">
        <h1>🔊 Sound Mixer Party</h1>
        <input type="text" id="player-name" placeholder="名前を入力"
            style="padding:12px; width:80%; font-size: 18px; border-radius: 5px; border: 1px solid #ccc;">
        <br><br>
        <button class="btn" onclick="joinGame()">ゲームに参加する</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-role" style="margin:0; color: #007bff;">確認中...</h3>
                <button class="btn btn-secondary" onclick="leaveGame()">退出</button>
            </div>
            <h2 id="my-score" style="font-size: 2.5em; margin: 10px 0;">0 pt</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 ホストパネル</h3>
            <button id="gen-btn" class="btn" onclick="generateSounds()">1. 音源をランダム選出</button>
            <div id="playback-area" class="hidden">
                <div id="playback-controls">
                    <button class="btn btn-success" onclick="playAll()">▶ 再生開始</button>
                    <button class="btn btn-danger" onclick="pauseAll()">⏸ 一時停止</button>
                </div>
                <div id="sound-mixers"></div>
            </div>
            <hr>
            <h4>ポイント配布 (1人1回)</h4>
            <div id="player-scoring"></div>
            <button class="btn btn-success" style="width:100%; padding:18px;" onclick="endTurn()">交代する</button>
        </div>

        <div id="player-waiting" class="card hidden">
            <div style="font-size: 4em; margin: 20px 0;">👂</div>
            <p>ホストが準備中です...</p>
        </div>

        <div class="card">
            <h3 style="border-bottom: 2px solid #007bff; display: inline-block;">ランキング</h3>
            <div id="rankings"></div>
            <hr>
            <button class="btn btn-danger" style="font-size: 0.7em;" onclick="resetAll()">リセット</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { soundList } from "./sounds.js";

        // FIXME: 自身のFirebase情報をここに貼り付け
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioElements = [];
        let isSoundGenerated = false;
        let distributedPlayers = new Set();
        let lastAwardId = "";

        window.joinGame = async () => {
            const nameInput = document.getElementById('player-name').value;
            if (!nameInput) return alert("名前を入力してください");
            myName = nameInput;
            try {
                const snap = await getDoc(gameRef);
                if (snap.exists() && Date.now() - (snap.data().updatedAt?.toMillis() || 0) > 600000) await deleteDoc(gameRef);
                const freshSnap = await getDoc(gameRef);
                if (!freshSnap.exists()) {
                    await setDoc(gameRef, { players: [{ name: myName, score: 0 }], hostIndex: 0, updatedAt: serverTimestamp(), lastAward: null });
                } else {
                    const players = freshSnap.data().players || [];
                    if (players.find(p => p.name === myName)) return alert("使用中");
                    players.push({ name: myName, score: 0 });
                    await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
                }
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                startSync();
            } catch (e) { console.error(e); }
        };

        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) { location.reload(); return; }
                const data = docSnap.data();
                checkAwardEffect(data);
                updateUI(data);
            });
        }

        // --- 演出ロジックの強化 ---
        function checkAwardEffect(data) {
            const award = data.lastAward;
            if (!award || award.target !== myName || award.id === lastAwardId) return;

            lastAwardId = award.id;

            if (award.pt < 0) {
                // マイナス演出
                triggerOverlay('danger-overlay', 'warn.mp3', [200, 100, 200]);
            } else if (award.pt === 3) {
                // 最高得点(3pt)の特別演出
                document.getElementById('great-name').innerText = award.soundName.toUpperCase() + "!";
                document.getElementById('great-pt').innerText = `+${award.pt} POINTS!!`;
                triggerOverlay('great-overlay', 'great.mp3', [100, 50, 100, 50, 500]);
            } else {
                // 通常正解(1, 2pt)の演出
                document.getElementById('success-name').innerText = award.soundName.toUpperCase() + "!";
                document.getElementById('success-pt').innerText = `+${award.pt} pt`;
                triggerOverlay('success-overlay', 'success.mp3', [100, 50, 100]);
            }
        }

        function triggerOverlay(id, soundFile, vibePattern) {
            const overlay = document.getElementById(id);
            overlay.style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(vibePattern);
            new Audio(`sounds/${soundFile}`).play().catch(e => console.log(e));
            setTimeout(() => { overlay.style.display = 'none'; }, 3500);
        }

        function updateUI(data) {
            const players = data.players || [];
            if (players.length === 0) return;
            const host = players[data.hostIndex % players.length];
            const isHost = (host && host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "役割: あなたがホスト 👑" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);
            document.getElementById('player-waiting').classList.toggle('hidden', isHost);

            if (!isHost) stopAllSounds();
            document.getElementById('my-score').innerText = (players.find(p => p.name === myName)?.score || 0) + " pt";

            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            const topScore = sortedPlayers[0].score;
            document.getElementById('rankings').innerHTML = sortedPlayers.map(p => {
                const crown = (p.score === topScore && p.score > 0) ? '<span class="crown">👑</span>' : '';
                return `<div class="player-item"><span>${crown}${p.name}</span><b>${p.score} pt</b></div>`;
            }).join('');

            if (isHost) {
                document.getElementById('player-scoring').innerHTML = players.map(p => {
                    const isDone = distributedPlayers.has(p.name);
                    return `<div style="margin:10px 0; border-bottom: 1px dashed #ccc; padding-bottom:5px;">
                        <span style="display:inline-block; width:80px; font-weight:bold;">${p.name}</span>
                        ${isDone ? '<span style="color:#28a745;">配布済み</span>' : `
                            <button class="btn btn-success" style="padding:5px 10px;" onclick="window.distributePt('${p.name}', 0)">音1</button>
                            <button class="btn btn-success" style="padding:5px 10px;" onclick="window.distributePt('${p.name}', 1)">音2</button>
                            <button class="btn btn-success" style="padding:5px 10px;" onclick="window.distributePt('${p.name}', 2)">音3</button>
                            <button class="btn btn-danger" style="padding:5px 10px;" onclick="window.distributePt('${p.name}', 3)">音4</button>
                        `}</div>`;
                }).join('');
            }
        }

        /* --- ホスト：ポイント選択の重複チェック --- */
        window.validatePoints = (idx) => {
            const selects = [0, 1, 2, 3].map(i => document.getElementById(`pt-select-${i}`).value);
            const isDuplicate = selects.some((val, i) => i !== idx && val === selects[idx]);
            if (isDuplicate) {
                alert("同じポイントは選べません！");
                const all = ["1", "2", "3", "-2"];
                document.getElementById(`pt-select-${idx}`).value = all.find(opt => !selects.filter((v, i) => i !== idx).includes(opt));
            }
            window.updatePtBadge(idx);
        };

        window.updatePtBadge = (i) => {
            const val = document.getElementById(`pt-select-${i}`).value;
            document.getElementById(`pt-badge-${i}`).innerText = val + "pt";
        };

        window.distributePt = async (targetName, soundIdx) => {
            if (distributedPlayers.has(targetName)) return;
            const pt = parseInt(document.getElementById(`pt-select-${soundIdx}`).value);
            const soundName = window.currentSoundNames[soundIdx];
            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => { if (p.name === targetName) p.score += pt; return p; });
            await updateDoc(gameRef, { players, updatedAt: serverTimestamp(), lastAward: { target: targetName, pt: pt, soundName: soundName, id: Math.random() } });
            distributedPlayers.add(targetName);
        };

        /* --- 音響・その他 --- */
        window.stopAllSounds = () => {
            audioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });
            audioElements = [];
            document.getElementById('sound-mixers').innerHTML = "";
            document.getElementById('playback-area').classList.add('hidden');
            const genBtn = document.getElementById('gen-btn');
            if (genBtn) { genBtn.disabled = false; genBtn.innerText = "1. 音源をランダム選出"; }
            isSoundGenerated = false;
        };

        window.generateSounds = () => {
            if (isSoundGenerated) return;
            const shuffled = [...soundList].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 4);
            window.currentSoundNames = selected.map(s => s.name);
            selected.forEach((sound, i) => {
                const audio = new Audio(sound.file);
                audio.loop = true; audio.volume = 0; audioElements.push(audio);
                const defaultPts = ["1", "2", "3", "-2"];
                document.getElementById('sound-mixers').innerHTML += `
                    <div class="sound-control">
                        <strong>音源${i + 1}: ${sound.name}</strong> 
                        <select id="pt-select-${i}" onchange="window.validatePoints(${i})">
                            <option value="1" ${i == 0 ? 'selected' : ''}>1pt</option>
                            <option value="2" ${i == 1 ? 'selected' : ''}>2pt</option>
                            <option value="3" ${i == 2 ? 'selected' : ''}>3pt</option>
                            <option value="-2" ${i == 3 ? 'selected' : ''}>-2pt</option>
                        </select>
                        <span id="pt-badge-${i}" class="score-badge">${defaultPts[i]}pt</span><br>
                        <input type="range" min="0" max="1" step="0.1" value="0" oninput="window.changeVol(${i}, this.value)">
                    </div>`;
            });
            isSoundGenerated = true; document.getElementById('gen-btn').disabled = true;
            document.getElementById('playback-area').classList.remove('hidden');
        };

        window.playAll = () => audioElements.forEach(audio => audio.play().catch(e => console.warn(e)));
        window.pauseAll = () => audioElements.forEach(audio => audio.pause());
        window.changeVol = (idx, vol) => { if (audioElements[idx]) audioElements[idx].volume = vol; };
        window.endTurn = async () => {
            if (!confirm("交代しますか？")) return;
            const snap = await getDoc(gameRef);
            window.stopAllSounds();
            distributedPlayers.clear();
            await updateDoc(gameRef, { hostIndex: (snap.data().hostIndex + 1) % snap.data().players.length, updatedAt: serverTimestamp(), lastAward: null });
        };
        window.leaveGame = async () => {
            const snap = await getDoc(gameRef);
            if (!snap.exists()) return;
            const players = snap.data().players.filter(p => p.name !== myName);
            players.length === 0 ? await deleteDoc(gameRef) : await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
            location.reload();
        };
        window.resetAll = async () => { if (confirm("リセット？")) await deleteDoc(gameRef); };
        window.addEventListener('beforeunload', () => { if (myName) window.leaveGame(); });
    </script>
</body>

</html>
