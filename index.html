<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Mixer Party - Drag & Drop Ver.</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #ff4757;
        }

        .btn-secondary {
            background: #6c757d;
            font-size: 14px;
        }

        .host-area {
            border: 3px solid #ff4757;
            background: #fff5f5;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        /* ドラッグ＆ドロップ用スタイル */
        .point-chips {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .chip {
            width: 50px;
            height: 50px;
            line-height: 50px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 4px 0 #0056b3;
        }

        .chip[data-pt="-2"] {
            background: #ff4757;
            box-shadow: 0 4px 0 #c0392b;
        }

        .chip[data-pt="3"] {
            background: #ffca28;
            color: #333;
            box-shadow: 0 4px 0 #f57f17;
        }

        .sound-control {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            border: 2px dashed #ccc;
        }

        .drop-zone {
            height: 60px;
            border: 2px dashed #aaa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            background: #fff;
        }

        .drop-zone.active {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        input[type=range] {
            width: 100%;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        /* 演出用 */
        #danger-overlay,
        #success-overlay,
        #great-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: none;
            pointer-events: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #danger-overlay {
            animation: flash-red 0.25s infinite;
        }

        #success-overlay {
            background-color: rgba(40, 167, 69, 0.9);
            color: white;
        }

        #great-overlay {
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            background-size: 200% 200%;
            animation: shine 2s infinite linear;
            color: white;
        }

        .overlay-text {
            font-size: 15vw;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes flash-red {

            0%,
            100% {
                background-color: rgba(255, 0, 0, 0.8);
            }

            50% {
                background-color: transparent;
            }
        }

        @keyframes shine {
            0% {
                background-position: -200%;
            }

            100% {
                background-position: 200%;
            }
        }
    </style>
</head>

<body>

    <div id="danger-overlay">
        <div class="overlay-text">DANGER!</div>
    </div>
    <div id="success-overlay">
        <div id="success-name" class="overlay-text">GOOD!</div>
    </div>
    <div id="great-overlay">
        <div id="great-name" class="overlay-text">GREAT!!</div>
    </div>

    <div id="setup-screen" class="card">
        <h1>🔊 Sound Mixer Party</h1>
        <input type="text" id="player-name" placeholder="名前を入力"
            style="padding:12px; width:80%; font-size: 18px; border-radius: 5px; border: 1px solid #ccc;">
        <br><br>
        <button class="btn" onclick="joinGame()">参加する</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <h3 id="current-role" style="margin:0; color: #007bff;">確認中...</h3>
            <h2 id="my-score">0 pt</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 ホストパネル</h3>
            <button id="gen-btn" class="btn" onclick="generateSounds()">1. 音源をランダム選出</button>

            <div id="playback-area" class="hidden">
                <p>チップを枠内にドラッグしてポイント設定：</p>
                <div class="point-chips" id="point-pool">
                    <div class="chip" draggable="true" ondragstart="drag(event)" id="chip-1" data-pt="1">1pt</div>
                    <div class="chip" draggable="true" ondragstart="drag(event)" id="chip-2" data-pt="2">2pt</div>
                    <div class="chip" draggable="true" ondragstart="drag(event)" id="chip-3" data-pt="3">3pt</div>
                    <div class="chip" draggable="true" ondragstart="drag(event)" id="chip-m2" data-pt="-2">-2pt</div>
                </div>

                <div id="playback-controls" style="margin-top:20px;">
                    <button class="btn btn-success" onclick="playAll()">▶ 再生開始</button>
                    <button class="btn btn-danger" onclick="pauseAll()">⏸ 停止</button>
                </div>
                <div id="sound-mixers"></div>
            </div>

            <hr>
            <h4>不正解者への配布（全員外れた時用）</h4>
            <div id="player-scoring"></div>
            <button class="btn btn-success" style="width:100%; padding:18px; margin-top:20px;"
                onclick="endTurn()">交代する</button>
        </div>

        <div id="player-waiting" class="card hidden">
            <div style="font-size: 4em; margin: 20px 0;">👂</div>
            <p>ホストが準備中...</p>
        </div>

        <div class="card">
            <h3>ランキング</h3>
            <div id="rankings"></div>
            <hr>
            <button class="btn btn-danger" style="font-size: 0.7em;" onclick="resetAll()">リセット</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { soundList } from "./sounds.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1");

        let myName = "";
        let audioElements = [];
        let isSoundGenerated = false;
        let distributedPlayers = new Set();
        let lastAwardId = "";
        let soundPoints = [0, 0, 0, 0]; // 各音源にセットされたpt

        window.joinGame = async () => {
            const nameInput = document.getElementById('player-name').value;
            if (!nameInput) return;
            myName = nameInput;
            const snap = await getDoc(gameRef);
            if (!snap.exists()) {
                await setDoc(gameRef, { players: [{ name: myName, score: 0 }], hostIndex: 0, updatedAt: serverTimestamp() });
            } else {
                const players = snap.data().players;
                if (!players.find(p => p.name === myName)) {
                    players.push({ name: myName, score: 0 });
                    await updateDoc(gameRef, { players, updatedAt: serverTimestamp() });
                }
            }
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        function startSync() {
            onSnapshot(gameRef, (docSnap) => {
                if (!docSnap.exists()) { location.reload(); return; }
                const data = docSnap.data();
                checkAwardEffect(data);
                updateUI(data);
            });
        }

        // --- ドラッグ＆ドロップ関数 ---
        window.drag = (ev) => { ev.dataTransfer.setData("text", ev.target.id); };
        window.allowDrop = (ev) => { ev.preventDefault(); };
        window.drop = (ev) => {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const chip = document.getElementById(data);
            const dropzone = ev.target.closest('.drop-zone');
            if (!dropzone) return;

            // すでに何か入っていたら元に戻す
            if (dropzone.hasChildNodes()) {
                document.getElementById('point-pool').appendChild(dropzone.firstChild);
            }

            dropzone.appendChild(chip);
            const idx = dropzone.dataset.idx;
            soundPoints[idx] = parseInt(chip.dataset.pt);
        };

        function updateUI(data) {
            const players = data.players || [];
            const host = players[data.hostIndex % players.length];
            const isHost = (host && host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "役割: あなたがホスト 👑" : `ホスト: ${host.name}`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);
            document.getElementById('player-waiting').classList.toggle('hidden', isHost);

            if (!isHost) stopAllSounds();
            document.getElementById('my-score').innerText = (players.find(p => p.name === myName)?.score || 0) + " pt";

            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            document.getElementById('rankings').innerHTML = sortedPlayers.map(p => `
                <div class="player-item"><span>${p.name}</span><b>${p.score} pt</b></div>
            `).join('');

            if (isHost) {
                document.getElementById('player-scoring').innerHTML = players.map(p => {
                    const isDone = distributedPlayers.has(p.name);
                    return `<div style="margin:5px 0;">${p.name}: ${isDone ? '✅' : `
                        <button class="btn btn-success" style="padding:5px 20px;" onclick="window.distributePt('${p.name}', null, 2)">+2pt 配布</button>
                    `}</div>`;
                }).join('');
            }
        }

        /* --- ポイント配布 --- */
        window.distributePt = async (targetName, soundIdx, manualPt = null) => {
            if (distributedPlayers.has(targetName)) return;

            let pt = manualPt;
            let sName = "SPECIAL";

            if (soundIdx !== null) {
                pt = soundPoints[soundIdx];
                sName = window.currentSoundNames[soundIdx];
                if (pt === 0) return alert("ポイントを設定してください！");
            }

            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => { if (p.name === targetName) p.score += pt; return p; });
            await updateDoc(gameRef, { players, updatedAt: serverTimestamp(), lastAward: { target: targetName, pt: pt, soundName: sName, id: Math.random() } });
            distributedPlayers.add(targetName);
        };

        /* --- 演出・音響 --- */
        window.stopAllSounds = () => {
            audioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });
            audioElements = [];
            document.getElementById('sound-mixers').innerHTML = "";
            document.getElementById('playback-area').classList.add('hidden');
            soundPoints = [0, 0, 0, 0];
            const pool = document.getElementById('point-pool');
            [1, 2, 3, 'm2'].forEach(id => pool.appendChild(document.getElementById('chip-' + id)));
            isSoundGenerated = false;
        };

        window.generateSounds = () => {
            const shuffled = [...soundList].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 4);
            window.currentSoundNames = selected.map(s => s.name);

            selected.forEach((sound, i) => {
                const audio = new Audio(sound.file);
                audio.loop = true; audio.volume = 0; audioElements.push(audio);
                document.getElementById('sound-mixers').innerHTML += `
                    <div class="sound-control">
                        <strong>音源${i + 1}: ${sound.name}</strong> 
                        <div class="drop-zone" data-idx="${i}" ondrop="drop(event)" ondragover="allowDrop(event)">ここにチップをドラッグ</div>
                        <input type="range" min="0" max="1" step="0.1" value="0" oninput="window.changeVol(${i}, this.value)">
                        <button class="btn btn-secondary" style="width:100%; margin-top:5px;" onclick="window.showDistributeUI(${i})">正解者に配布</button>
                    </div>`;
            });
            isSoundGenerated = true;
            document.getElementById('playback-area').classList.remove('hidden');
        };

        window.showDistributeUI = (sIdx) => {
            const name = prompt("誰が正解しましたか？（名前を正確に）");
            if (name) window.distributePt(name, sIdx);
        };

        function checkAwardEffect(data) {
            const award = data.lastAward;
            if (!award || award.target !== myName || award.id === lastAwardId) return;
            lastAwardId = award.id;
            const id = award.pt < 0 ? 'danger-overlay' : (award.pt === 3 ? 'great-overlay' : 'success-overlay');
            const sound = award.pt < 0 ? 'warn.mp3' : (award.pt === 3 ? 'great.mp3' : 'success.mp3');
            document.getElementById(id.replace('-overlay', '-name')).innerText = award.soundName.toUpperCase();
            triggerOverlay(id, sound);
        }

        function triggerOverlay(id, soundFile) {
            const overlay = document.getElementById(id);
            overlay.style.display = 'flex';
            new Audio(`sounds/${soundFile}`).play().catch(e => console.log(e));
            setTimeout(() => { overlay.style.display = 'none'; }, 3000);
        }

        window.changeVol = (idx, vol) => { if (audioElements[idx]) audioElements[idx].volume = vol; };
        window.playAll = () => audioElements.forEach(audio => audio.play());
        window.pauseAll = () => audioElements.forEach(audio => audio.pause());
        window.endTurn = async () => {
            const snap = await getDoc(gameRef);
            window.stopAllSounds();
            distributedPlayers.clear();
            await updateDoc(gameRef, { hostIndex: (snap.data().hostIndex + 1) % snap.data().players.length, updatedAt: serverTimestamp(), lastAward: null });
        };
        window.resetAll = async () => { if (confirm("リセット？")) await deleteDoc(gameRef); location.reload(); };
        window.leaveGame = async () => { location.reload(); };
    </script>
</body>

</html>
