<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Mixer Party</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .host-area {
            border: 2px solid #ff4757;
            padding: 10px;
        }

        .player-list {
            list-style: none;
            padding: 0;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .sound-control {
            margin: 15px 0;
            padding: 10px;
            background: #eee;
            border-radius: 10px;
        }

        input[type=range] {
            width: 80%;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="setup-screen" class="card">
        <h2>参加登録</h2>
        <input type="text" id="player-name" placeholder="名前を入力">
        <button class="btn" onclick="joinGame()">ゲームに参加</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <h3 id="current-role">あなたの役割: ロード中...</h3>
            <h2 id="my-score">ポイント: 0</h2>
        </div>

        <div id="host-controls" class="card host-area hidden">
            <h3>🎨 ホスト操作パネル</h3>
            <button class="btn" onclick="generateSounds()">音をランダム生成</button>
            <div id="sound-mixers"></div>
            <hr>
            <h4>ポイント配布 (口頭で回答を確認)</h4>
            <div id="player-scoring"></div>
            <button class="btn" style="background:#28a745" onclick="endTurn()">ターンを終了して結果表示</button>
        </div>

        <div class="card">
            <h3>現在のランキング</h3>
            <div id="rankings" class="player-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FIXME: ここにFirebaseからコピーした設定を貼り付けてください
        const firebaseConfig = {
            apiKey: "AIzaSyBiej_LtMZeKi3aLDIgo5XjJoSeAngORw8",
            authDomain: "soundmaskgame.firebaseapp.com",
            projectId: "soundmaskgame",
            storageBucket: "soundmaskgame.firebasestorage.app",
            messagingSenderId: "721055645014",
            appId: "1:721055645014:web:7793dc55b285220efa2af7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameRef = doc(db, "games", "party-room-1"); // 固定の部屋名

        let myName = "";
        let isHost = false;
        let sounds = [];
        let audioContext = null;
        let oscillators = [];

        // 参加処理
        window.joinGame = async () => {
            myName = document.getElementById('player-name').value;
            if (!myName) return alert("名前を入力してください");

            const snap = await getDoc(gameRef);
            if (!snap.exists()) {
                await setDoc(gameRef, { players: [{ name: myName, score: 0 }], hostIndex: 0, status: 'playing' });
            } else {
                await updateDoc(gameRef, {
                    players: arrayUnion({ name: myName, score: 0 })
                });
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startSync();
        };

        // リアルタイム同期
        function startSync() {
            onSnapshot(gameRef, (doc) => {
                const data = doc.data();
                updateUI(data);
            });
        }

        function updateUI(data) {
            const players = data.players;
            const host = players[data.hostIndex];
            isHost = (host.name === myName);

            document.getElementById('current-role').innerText = isHost ? "あなたは【ホスト】です" : `ホストは ${host.name} です`;
            document.getElementById('host-controls').classList.toggle('hidden', !isHost);

            // スコア表示
            const me = players.find(p => p.name === myName);
            document.getElementById('my-score').innerText = `ポイント: ${me.score}`;

            // ランキング更新
            const rankDiv = document.getElementById('rankings');
            rankDiv.innerHTML = players.map(p => `<div class="player-item"><span>${p.name}</span><b>${p.score}pt</b></div>`).join('');

            // ホスト用のスコア配布ボタン作成
            if (isHost) {
                const scoringDiv = document.getElementById('player-scoring');
                scoringDiv.innerHTML = players.map(p => `
                    <div style="margin:5px">
                        ${p.name}: 
                        <button onclick="addPt('${p.name}', 1)">+1</button>
                        <button onclick="addPt('${p.name}', 2)">+2</button>
                        <button onclick="addPt('${p.name}', 3)">+3</button>
                        <button onclick="addPt('${p.name}', -2)">-2</button>
                    </div>
                `).join('');
            }
        }

        // 音の生成 (Web Audio API)
        window.generateSounds = () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const mixerDiv = document.getElementById('sound-mixers');
            mixerDiv.innerHTML = "";
            oscillators.forEach(o => o.stop());
            oscillators = [];

            const frequencies = [220, 440, 660, 880]; // ランダムの代わりに周波数を変える例
            frequencies.forEach((freq, i) => {
                const gainNode = audioContext.createGain();
                const osc = audioContext.createOscillator();
                osc.frequency.value = freq;
                osc.connect(gainNode).connect(audioContext.destination);
                gainNode.gain.value = 0;
                osc.start();
                oscillators.push(osc);

                mixerDiv.innerHTML += `
                    <div class="sound-control">
                        音 ${i + 1} (設定ポイント: ${[1, 2, 3, -2][i]}pt) <br>
                        音量: <input type="range" min="0" max="1" step="0.1" value="0" 
                        oninput="changeVolume(${i}, this.value)">
                    </div>
                `;
                window[`gainNode${i}`] = gainNode;
            });
        };

        window.changeVolume = (index, vol) => {
            window[`gainNode${index}`].gain.value = vol;
        };

        window.addPt = async (targetName, pt) => {
            const snap = await getDoc(gameRef);
            const players = snap.data().players.map(p => {
                if (p.name === targetName) p.score += pt;
                return p;
            });
            await updateDoc(gameRef, { players });
        };

        window.endTurn = async () => {
            const snap = await getDoc(gameRef);
            let nextHost = snap.data().hostIndex + 1;
            if (nextHost >= snap.data().players.length) nextHost = 0;

            alert("ターンを終了します。結果を全員で確認してください！");
            await updateDoc(gameRef, { hostIndex: nextHost });
            location.reload(); // 音を止めるためにリロード
        };
    </script>
</body>

</html>
